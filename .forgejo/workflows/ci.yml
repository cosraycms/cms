name: ci

on:
  push:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ci-base
    env:
      COSRAY_DB_HOST: pgsql
      COSRAY_DB_NAME: cosray
      COSRAY_DB_USER: cosray
      COSRAY_DB_PASSWORD: cosray
    services:
      pgsql:
        image: postgres:17
        env:
          POSTGRES_DB: cosray
          POSTGRES_USER: cosray
          POSTGRES_PASSWORD: cosray
        options: >-
          --health-cmd="pg_isready -U cosray -d cosray"
          --health-interval=5s --health-retries=20
    steps:
      - name: Checkout repo
        uses: https://code.forgejo.org/actions/checkout@v5

      - name: Install packages with composer
        run: composer install --prefer-dist --no-interaction
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GH_TOKEN }}"}}'

      - name: Run license lint checks
        run: composer license:lint

      - name: Run PHP lint checks
        run: composer lint

      - name: Run Markdown lint checks
        run: composer docs:lint

      - name: Setup pnpm
        uses: https://code.forgejo.org/pnpm/action-setup@v4
        with:
          package_json_file: panel/package.json

      - name: Install panel dependencies
        working-directory: panel
        run: pnpm install --frozen-lockfile

      - name: Check vendored panel modules
        working-directory: panel
        run: pnpm run modules:check

      - name: Run panel checks
        working-directory: panel
        run: pnpm check

      - name: Run panel tests
        working-directory: panel
        run: pnpm test

      - name: Initialize database schema
        run: php ./run db:migrations --namespace=install --apply

      - name: Apply system update migrations
        run: php ./run db:migrations --apply

      - name: Run tests with coverage
        # Composer's own process timeout is disabled for this script, so the
        # bound that catches a hung test lives here.
        timeout-minutes: 20
        run: composer coverage:test
        env:
          XDEBUG_MODE: coverage

      - name: Analyze coverage
        run: composer coverage:analyze

      - name: Deploy code coverage report
        if: ${{ always() && forgejo.ref == 'refs/heads/main' }}
        run: deploy-code-coverage .coverage
